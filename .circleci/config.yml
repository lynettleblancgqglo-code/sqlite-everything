          name: Count prior
          command: |
            awk '{printf "%-5d %s\n", NR, substr($0,1,25)}' /tmp/build/delta/179.230 2>/dev/null | head -3 || true
      - run:
          name: Get fresh code
          command: git clone --quiet --no-single-branch --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
