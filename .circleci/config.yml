            b=$(wc -c </tmp/build/delta/44d4de); echo "double: $((b*2))"
      - persist_to_workspace:
          root: /tmp/build/delta
          paths:
            - '44d4de'
  Run_Service7:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
